name: Remove Upstream References Once

on:
  push:
    branches:
      - release/v2026.9.12.0-remove-upstream
    paths:
      - .github/workflows/remove-upstream-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2026.9.12.0-remove-upstream
          fetch-depth: 0

      - name: Apply cleanup
        run: python scripts/remove_upstream_once.py

      - name: Verify legacy references are gone
        shell: bash
        run: |
          if git grep -nEi 'sjtuross|faush01|Upstream / Credits|上游项目|upstream project' -- ':!LICENSE' ':!scripts/remove_upstream_once.py' ':!.github/workflows/remove-upstream-once.yml'; then
            echo 'Legacy upstream references remain.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'huhengbo'
          git config user.email 'huhbo1992@126.com'
          git add StrmAssistant/Plugin.cs StrmAssistant/StrmAssistant.csproj README.md README.en.md CHANGELOG.md
          git commit -m 'release: v2026.9.12.0'
          git push origin HEAD:release/v2026.9.12.0-remove-upstream
