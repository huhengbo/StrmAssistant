name: Apply Logo

on:
  push:
    paths:
      - '.github/workflows/apply-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace plugin logo
        shell: bash
        run: |
          set -euo pipefail
          base64 -d StrmAssistant/Properties/thumb-staged.b64 > StrmAssistant/Properties/thumb.png
          file StrmAssistant/Properties/thumb.png
          sha256sum StrmAssistant/Properties/thumb.png
          rm -f StrmAssistant/Properties/thumb-new.tmp
          rm -f StrmAssistant/Properties/thumb-staged.b64
          rm -f .github/workflows/apply-logo.yml

      - name: Commit final logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: replace plugin logo'
          git push
