name: Build Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build and test plugin
        run: ./scripts/build-plugin.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAssistantLite
          path: artifacts/StrmAssistantLite.dll
